name: Build desktop packages

on: workflow_dispatch

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyInstaller==6.22.3
      - run: python -B -m unittest discover -s tests
      - run: python -B scripts/build-desktop.py --output packages
      - uses: actions/upload-artifact@v4
        with:
          name: codex-sticky-notes-${{ matrix.os }}
          path: packages/*.zip
          if-no-files-found: error
